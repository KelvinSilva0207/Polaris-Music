name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: "3.47.6"

jobs:
  analyze:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Install Linux desktop headers (native assets)
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libx11-dev libxi-dev
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  build-windows:
    name: Build Windows
    needs: analyze
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Rust toolchain (smtc_windows)
        uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build Windows installer
        shell: pwsh
        run: .\installer\build_installer.ps1 -SkipBuild
      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath polaris-music-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-music-windows-x64
          path: polaris-music-windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-music-windows-installer
          path: installer/Output/Polaris-Music-Setup-*.exe
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get
      - name: Restore Android release keystore
        shell: bash
        env:
          POLARIS_KEYSTORE_BASE64: ${{ secrets.POLARIS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$POLARIS_KEYSTORE_BASE64" ]; then
            echo "Falta el secret POLARIS_KEYSTORE_BASE64; consulta android/RELEASE_SIGNING.md" >&2
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/polaris-signing"
          printf '%s' "$POLARIS_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/polaris-signing/polaris-release.jks"
      - name: Build signed APK
        env:
          POLARIS_REQUIRE_RELEASE_SIGNING: "true"
          POLARIS_KEYSTORE_PATH: ${{ runner.temp }}/polaris-signing/polaris-release.jks
          POLARIS_KEYSTORE_PASSWORD: ${{ secrets.POLARIS_KEYSTORE_PASSWORD }}
          POLARIS_KEY_ALIAS: ${{ secrets.POLARIS_KEY_ALIAS }}
          POLARIS_KEY_PASSWORD: ${{ secrets.POLARIS_KEY_PASSWORD }}
        run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: polaris-music-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Collect files
        run: |
          mkdir -p out
          cp dist/polaris-music-windows-installer/Polaris-Music-Setup-*.exe out/
          cp dist/polaris-music-windows-x64/polaris-music-windows-x64.zip out/
          cp dist/polaris-music-android/app-release.apk out/polaris-music-android.apk
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*
          generate_release_notes: true
